# Documentation: https://haobogu.github.io/rmk/keyboard_configuration.html
[keyboard]
name = "Wingxsl"
product_name = "Wingxsl"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Noir Guo"
chip = "nrf52840"

[layout]
rows = 4
cols = 12
layers = 3
keymap = [
    [
        ["Escape", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "Backslash"],
        ["CapsLock", "A", "S", "D", "F", "G", "H", "J", "K", "L", "Semicolon", "Enter"],
        ["LShift", "Z", "X", "C", "V", "B", "N", "M", "Comma", "Dot", "Slash", "RShift"],
        ["_", "_", "WM(Minus,LCtrl)", "WM(Equal,LAlt)", "WM(Grave,LGui)", "Enter", "LT(1, Delete)", "Space", "LT(2, Quote)", "Backspace", "_", "_"]
    ],
    [
        ["Tab", "Kc1", "Kc2", "Kc3", "Kc4", "Kc5", "Kc6", "Kc7", "Kc8", "Kc9", "Kc0", "Backspace"],
        ["_", "_", "_", "_", "_", "_", "Home", "_", "Up", "LeftBracket", "RightBracket", "F12"],
        ["_", "_", "_", "_", "_", "_", "End", "Left", "Down", "Right", "_", "Enter"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"]
    ],
    [
        ["F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11", "F12"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"]
    ],
]

[rmk]
# Maximum number of combos keyboard can store
combo_max_num = 15
# Maximum number of keys pressed simultaneously in a combo
combo_max_length = 4

[ble]
enabled = true
# 电量报告
battery_adc_pin = "P0_04"
adc_divider_measured = 2000    # R2 = 2MΩ = 2000kΩ
adc_divider_total = 2820       # R1+R2 = 820kΩ+2MΩ = 2820kΩ
default_tx_power = 0
use_2m_phy = true

[split]
connection = "ble"

[split.central]
rows = 4
cols = 6
row_offset = 0
col_offset = 0
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]
[split.central.matrix]
matrix_type = "normal"
col_pins = ["P0_10", "P1_06", "P0_29", "P0_08", "P0_06", "P0_31"]
row_pins = ["P0_02", "P1_11", "P0_09", "P0_24"]
# row2col = true

[[split.peripheral]]
rows = 4
cols = 6
row_offset = 0
col_offset = 6
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]
[split.peripheral.matrix]
matrix_type = "normal"
col_pins = ["P0_08", "P0_24", "P0_10", "P0_09", "P1_04", "P1_06"]
row_pins = ["P1_11", "P0_02", "P0_29", "P0_31"]
# row2col = true
