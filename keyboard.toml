# Documentation: https://haobogu.github.io/rmk/keyboard_configuration.html
[keyboard]
name = "hpd-rmk"
product_name = "hpd-rmk"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Noir Guo"
chip = "nrf52840"

[layout]
rows = 6
cols = 12
layers = 3
keymap = [
    [
        ["Escape", "Kc1", "Kc2", "Kc3", "Kc4", "Kc5", "Kc6", "Kc7", "Kc8", "Kc9", "Kc0", "Backspace"],
        ["LT(1, Tab)", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "Backslash"],
        ["CapsLock", "A", "S", "D", "F", "G", "H", "J", "K", "L", "Semicolon", "Enter"],
        ["LShift", "Z", "X", "C", "V", "B", "N", "M", "Comma", "Dot", "Slash", "RShift"],
        ["MouseBtn2", "LT(1, Grave)", "TD(0)", "TD(1)", "MouseBtn1", "LAlt", "Space", "LT(1, Quote)", "LeftBracket", "LeftBracket", "Escape", "LT(2, Delete)"],
        ["MouseBtn3", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"]
    ],
    [
        ["_", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11"],
        ["_", "_", "PageUp", "_", "_", "_", "_", "_", "Up", "LeftBracket", "RightBracket", "F12"],
        ["_", "Home", "PageDown", "End", "_", "_", "_", "Left", "Down", "Right", "_", "Enter"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"]
    ],
    [
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
        ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"]
    ],
]

[behavior.morse]
morses = [
  # td(0):
  { tap = "Minus", hold = "LCtrl" },
  # td(1):
  { tap = "Equal", hold = "LGui" }
]

[host]
# Unlock combination: simultaneous press of specified keys
# Format: [[row, col], [row, col], ...]
unlock_keys = [[0, 0], [0, 1]]  # Keys at (row=0,col=0) and (row=0,col=1)

[rmk]
# Maximum number of combos keyboard can store
combo_max_num = 15
# Maximum number of keys pressed simultaneously in a combo
combo_max_length = 4
# Default debounce time in milliseconds  
debounce_time = 5

[light]
# All light pins are high-active by default, uncomment if you want it to be low-active
# capslock.pin = "PB2"
# capslock.low_active = true
# scrolllock.pin = "PA3"
# scrolllock.low_active = true
# Just ignore if no light pin is used for it
# numslock.pin = "PA5"
# numslock.low_active = true

[storage]
# Storage feature is enabled by default
enabled = true
# Clear storage at keyboard boot.
# Set it to true will reset the storage(including keymap, BLE bond info, etc.) at each reboot.
# This option is useful when testing the firmware.
# clear_storage = true

# !!! Warning: RMK uses last 2 sectors of your microcontroller's flash by default. You have to ensure that those flash space is not used.
# If you're using a bootloader which puts itself at the end of the flast, like Adafruit_nRF52_Bootloader, RMK will break the bootloader.
# Setting the `start_addr` manually to avoid this. See: https://haobogu.github.io/rmk/storage.html

[ble]
enabled = true
# 电量报告
battery_adc_pin = "vddh"

[split]
connection = "ble"

[split.central]
rows = 6
cols = 6
row_offset = 0
col_offset = 6
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]
[split.central.matrix]
matrix_type = "normal"
col_pins = ["P0_06", "P0_08", "P0_17", "P1_04", "P1_06", "P0_09"]
row_pins = ["P0_10", "P1_11", "P1_13", "P1_15","P0_02","P0_24"]

# 轨迹球
[[split.central.input_device.pmw3610]]
name = "trackball0"
spi.instance = "bitbang0"
spi.sck = "P0_29"
spi.mosi = "P0_31"
spi.miso = "P0_31"
spi.cs = "P0_22"
# or spi = { instance = "bitbang0", sck = "P0_05", mosi = "P0_04", miso = "P0_04", cs = "P0_09" }
motion = "P0_20" # Optional. If omitted, the sensor is polled.

force_awake = false
smart_mode = true
cpi = 600
invert_x = true
invert_y = true
swap_xy = true

[[split.peripheral]]
rows = 6
cols = 6
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]
[split.peripheral.matrix]
matrix_type = "normal"
col_pins = ["P0_09", "P1_06", "P1_04", "P0_17", "P0_08", "P0_06"]
row_pins = ["P0_10", "P1_11", "P1_13", "P1_15","P0_02","P0_24"]

# 旋钮
[[split.peripheral.input_device.encoder]]
pin_a = "P0_29"
pin_b = "P0_31"
internal_pullup = false
phase = "resolution"
resolution = 1 # or 2
reverse = false