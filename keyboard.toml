# Documentation: https://haobogu.github.io/rmk/keyboard_configuration.html
[keyboard]
name = "Pad18"
product_name = "Pad18"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Noir Guo"
chip = "nrf52840"

[matrix]
# Input and output pins are mandatory
input_pins = ["P0_06", "P1_00", "P0_11", "P1_04", "P1_06"]
output_pins = ["P0_17", "P0_20", "P0_22", "P0_24"]
# WARNING: Currently row2col/col2row is set in RMK's feature gate, configs here do nothing actually
# row2col = true

[layout]
rows = 5
cols = 4
layers = 3
keymap = [
    [
        ["NumLock", "KpSlash", "KpAsterisk", "KpMinus"],
        ["Kp7", "Kp8", "Kp9", "KpPlus"],
        ["Kp4", "Kp5", "Kp6", "_"],
        ["Kp1", "Kp2", "Kp3", "KpEnter"],
        ["Kp0", "KpDot", "MouseBtn3", "Escape"]
    ],
    [
        ["_", "_","_", "_"],
        ["_", "_","_", "_"],
        ["_", "_","_", "_"],
        ["_", "_","_", "_"],
        ["_", "_","_", "_"]
    ],
    [
        ["_", "_","_", "_"],
        ["_", "_","_", "_"],
        ["_", "_","_", "_"],
        ["_", "_","_", "_"],
        ["_", "_","_", "_"]
    ],
]

[light]
# All light pins are high-active by default, uncomment if you want it to be low-active
# capslock.pin = "PB2"
# capslock.low_active = true
# scrolllock.pin = "PA3"
# scrolllock.low_active = true
# Just ignore if no light pin is used for it
# numslock.pin = "PA5"
# numslock.low_active = true



[storage]
# Storage feature is enabled by default
# enabled = false


# 7mm鼠标编码器
[[input_device.encoder]]
pin_a = "P0_10"
pin_b = "P0_09"
internal_pullup = false
phase = "e8h7" # 24定位12脉冲，12*4/24=2
# Whether the direction of the rotary encoder is reversed.
reverse = false


# 游戏手柄摇杆
[[input_device.joystick]]
name = "default"
pin_x = "P0_29"
pin_y = "P0_02"
pin_z = "_"
transform = [[1, 0], [0, 1]]
bias = [0, 0]
resolution = 1
# func = "mouse | n-direction key" # TODO: only mouse is supported now

# Ble configuration
[ble]
# Whether to enable BLE feature
enabled = true
# nRF52840's saadc pin for reading battery level, you can use a pin number or "vddh"
battery_adc_pin = "vddh"
